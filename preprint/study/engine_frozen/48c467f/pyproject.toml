[project]
name = "core-risk-kinematics"
version = "0.1.0"
license = "AGPL-3.0-or-later"
description = "Risk velocity and acceleration models over clinical risk scores."
requires-python = ">=3.11"
dependencies = ["core-common", "numpy>=1.26", "pandas>=2.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_kinematics"]

[tool.uv.sources]
core-common = { workspace = true }
