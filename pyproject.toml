[project]
name = "hospital-risk-velocity"
version = "2.0.0"
description = "Clinical risk dashboard: risk velocity, acceleration and a run-chart trend rule over incident reports. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin Monteagudo Farina" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_kinematics", "src/clinical_risk_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
